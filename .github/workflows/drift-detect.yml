name: Drift Detection

on:
  schedule:
    # 13:00 UTC daily
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: shared-network
            account_id: "400484420291"
          - environment: workload-dev
            account_id: "556166822095"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # terraform_wrapper must be disabled here: the wrapper script captures
      # stdout/stderr into step outputs but does not propagate the real process exit
      # code through $? - it always reports its own success, which silently swallows
      # the "2 = drift" signal from -detailed-exitcode below.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
          terraform_wrapper: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::778185677715:role/golden-path-github-actions
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -input=false
        working-directory: environments/${{ matrix.environment }}

      # detailed-exitcode: 0 = no drift, 1 = real error, 2 = drift present.
      # set +e so a drift exit code doesn't abort the step before we can branch on it.
      - name: Terraform plan (detect drift)
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -no-color -out=tfplan.binary
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Show drift diff
        if: steps.plan.outputs.exitcode == '2'
        working-directory: environments/${{ matrix.environment }}
        run: terraform show -no-color tfplan.binary > plan_diff.txt

      # golden-path-github-actions (the OIDC entry point) deliberately has no permissions
      # of its own - chain into this account's ci-deploy role, which already holds
      # sns:Publish on the alerts topic, rather than widening the entry-point role.
      - name: Switch to this account's deploy role for the SNS publish call
        if: steps.plan.outputs.exitcode == '2'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account_id }}:role/golden-path-ci-deploy
          role-chaining: true
          aws-region: us-east-1

      - name: Publish drift alert
        if: steps.plan.outputs.exitcode == '2'
        working-directory: environments/${{ matrix.environment }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Terraform drift detected in ${{ matrix.environment }} (golden-path-kit)."
            echo ""
            echo "Run: ${RUN_URL}"
            echo ""
            cat plan_diff.txt
          } > sns_message.txt
          aws sns publish \
            --topic-arn arn:aws:sns:us-east-1:778185677715:golden-path-drift-alerts \
            --subject "Terraform drift detected: ${{ matrix.environment }}" \
            --message file://sns_message.txt

      - name: Fail the job if drift or an error was found
        if: always() && (steps.plan.outputs.exitcode == '1' || steps.plan.outputs.exitcode == '2')
        run: |
          if [ "${{ steps.plan.outputs.exitcode }}" = "1" ]; then
            echo "::error::terraform plan failed for ${{ matrix.environment }}"
          else
            echo "::error::drift detected in ${{ matrix.environment }} - alert published to SNS"
          fi
          exit 1

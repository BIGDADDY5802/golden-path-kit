name: Plan

on:
  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"
      - name: Terraform fmt
        run: terraform fmt -check -recursive

  plan:
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        environment: [shared-network, workload-dev]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::778185677715:role/golden-path-github-actions
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -input=false
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform validate
        run: terraform validate
        working-directory: environments/${{ matrix.environment }}

      # aquasecurity/tfsec-action's soft_fail:false does not actually fail the step
      # regardless of findings (verified live: a run with a real CRITICAL public-ingress
      # finding still reported step success). Installing the binary directly and running
      # it ourselves so its own exit code is trusted, the same fix pattern as the
      # terraform_wrapper issue in drift-detect.yml.
      - uses: aquasecurity/setup-tfsec@v1.0.0

      # Excludes are accepted-by-design choices for this lab environment, not gaps:
      #   no-public-egress-sgr        - modules/security-group's default egress is 0.0.0.0/0 by design
      #   no-public-ip-subnet         - no NAT Gateway (cost control), so public subnets need public IPs
      #   enable-bucket-logging       - no real data in these demo buckets
      #   require-vpc-flow-logs       - no real traffic to audit in this demo VPC
      # Anything else, including public ingress, is fully enforced.
      - name: tfsec scan
        working-directory: environments/${{ matrix.environment }}
        run: |
          tfsec . --no-color \
            --exclude aws-ec2-no-public-egress-sgr,aws-ec2-no-public-ip-subnet,aws-s3-enable-bucket-logging,aws-ec2-require-vpc-flow-logs-for-all-vpcs

      - name: Terraform plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan.binary
        working-directory: environments/${{ matrix.environment }}

      - name: Terraform show (readable plan for the PR comment)
        id: show
        run: terraform show -no-color tfplan.binary
        working-directory: environments/${{ matrix.environment }}

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan — ${{ matrix.environment }}
            \`\`\`
            ${{ steps.show.outputs.stdout }}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
